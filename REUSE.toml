version = 1

[[annotations]]
path = [
	"conf/**",
	"data/**",
	"man/**",
]
SPDX-FileCopyrightText = "The Dire Wolf Authors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Samoyed's own work.
[[annotations]]
path = [
	"*.md",
	".claude/**",
	".git*",
	".github/**",
	".golangci.yml",
	"Makefile",
	"docs/**",
	"go.mod",
	"go.sum",
	"upstream-tracker/**",
]
SPDX-FileCopyrightText = "The Samoyed Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Derived from Dire Wolf, whose authors are among The Samoyed Authors (see AUTHORS.md).
# Dire Wolf's GPL-2.0-or-later lets it be combined with AGPL-3.0-or-later code (GPLv3 section 13).
# Original files in these directories declare AGPL-3.0-or-later in their own headers.
[[annotations]]
path = [
	"README.md",
	"cmd/**",
	"internal/direwolf/*.go",
	"test-scripts/**",
]
SPDX-FileCopyrightText = "The Samoyed Authors"
SPDX-License-Identifier = "GPL-2.0-or-later AND AGPL-3.0-or-later"

# Dire Wolf's revision history, carried over as-is.
[[annotations]]
path = "CHANGES.md"
SPDX-FileCopyrightText = "The Dire Wolf Authors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "debian/**"
SPDX-FileCopyrightText = "(C) 2014 Iain R. Learmonth <irl@fsfe.org>"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "internal/webui/static/vendor/leaflet/**"
SPDX-FileCopyrightText = [
	"2010-2023 Volodymyr Agafonkin",
	"2010-2011 CloudMade",
]
SPDX-License-Identifier = "BSD-2-Clause"

# The logo. Use of the name and logo is also governed by TRADEMARKS.md.
[[annotations]]
path = [
	"docs/source/_static/favicon.png",
	"docs/source/_static/logo.png",
	"internal/webui/static/favicon.png",
]
precedence = "override"
SPDX-FileCopyrightText = "The Samoyed Authors"
SPDX-License-Identifier = "CC-BY-SA-4.0"
