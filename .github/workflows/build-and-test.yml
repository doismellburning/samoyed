on:
  push:
    branches:
    - "main"
    tags:
    - "**"
  pull_request:
  workflow_dispatch:

# A push to a pull request supersedes whatever that pull request was already
# running, so put those runs in a per-branch group and cancel the older one
# rather than letting the two compete for runners.
#
# Everything else - main, tags, manual dispatches - gets a group to itself, so
# those runs can neither cancel nor be cancelled. `cancel-in-progress: false`
# would not be enough: a concurrency group holds only one *pending* run, and a
# newly queued run evicts the pending one regardless, which on a busy main could
# silently drop a run that was going to release.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  generate_version:
    runs-on: "ubuntu-latest"
    outputs:
      SAMOYED_VERSION: "${{ steps.version.outputs.SAMOYED_VERSION }}"
    steps:
    - uses: "actions/checkout@v7"
    - name: "Generate Version"
      id: "version"
      run: |
        export SAMOYED_VERSION=$(./version.sh)
        echo "Version: $SAMOYED_VERSION"
        echo "SAMOYED_VERSION=$SAMOYED_VERSION" >> $GITHUB_OUTPUT

  build_and_test:
    needs: [generate_version]
    strategy:
      matrix:
        runner:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "macos-latest"
    runs-on: "${{ matrix.runner }}"
    steps:
    - uses: "actions/checkout@v7"
    - uses: "actions/setup-go@v7"
      with:
        go-version: "1.27"
    - name: "Set Version"
      env:
        SAMOYED_VERSION: "${{ needs.generate_version.outputs.SAMOYED_VERSION }}"
      run: echo "SAMOYED_VERSION=$SAMOYED_VERSION" >> $GITHUB_ENV
    - name: "Install dependencies"
      run: "make setup"
    - run: "make stats"
    - run: "make cmds"
    - run: "make test"
    - run: "make race"
    - run: "make coveragereport"
    - run: "make check"
    - name: "Ensure nothing got fixed (i.e. everything was already fine)"
      run: "git diff --quiet && git diff --cached --quiet"
    - name: "Set filename"
      run: 'echo "TARBALL_NAME=samoyed-${{env.SAMOYED_VERSION }}-${{ runner.os }}-${{ runner.arch }}.tgz" >> $GITHUB_ENV'
    - name: "Build tarball"
      run: "tar czvf \"$TARBALL_NAME\" dist/"
    - uses: "actions/upload-artifact@v7"
      with:
        name: "${{ env.TARBALL_NAME }}"
        path: "${{ env.TARBALL_NAME }}"
        if-no-files-found: "error"
        compression-level: 0
    - name: "Build Debian package"
      if: "runner.os == 'Linux'"
      run: "make deb"
    - name: "Set deb filename"
      if: "runner.os == 'Linux'"
      run: 'echo "DEB_NAME=samoyed-binary_${{ env.SAMOYED_VERSION }}_$(dpkg --print-architecture).deb" >> $GITHUB_ENV'
    - name: "Upload Debian package"
      if: "runner.os == 'Linux'"
      uses: "actions/upload-artifact@v7"
      with:
        name: "${{ env.DEB_NAME }}"
        path: "${{ env.DEB_NAME }}"
        if-no-files-found: "error"
        compression-level: 0

  # Fuzzing is the same work whatever the runner, and it takes as long as it is
  # told to, so it gets a job of its own on one runner rather than adding its
  # time to each of build_and_test's three.
  fuzz:
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v7"
    - uses: "actions/setup-go@v7"
      with:
        go-version: "1.27"
    - name: "Install dependencies"
      run: "make setup"
    - name: "Fuzz the packet decoders"
      run: "make fuzz"

  should_release:
    runs-on: "ubuntu-latest"
    outputs:
      result: "${{ steps.check.outputs.result }}"
    steps:
    - uses: "actions/checkout@v7"
      with:
        fetch-depth: 2
    - name: "Check if release is warranted"
      id: "check"
      run: echo "result=$(./should-release.sh)" >> $GITHUB_OUTPUT

  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && needs.should_release.outputs.result == 'true')
    needs: [generate_version, build_and_test, fuzz, should_release]
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
    - uses: "actions/download-artifact@v8"
      with:
        merge-multiple: true
    - name: "Create Release"
      uses: "softprops/action-gh-release@v3"
      with:
        tag_name: "${{ needs.generate_version.outputs.SAMOYED_VERSION }}"
        name: "Release ${{ needs.generate_version.outputs.SAMOYED_VERSION }}"
        body: |
          Automated release for commit ${{ github.sha }}.

          You will need to fetch your own dependencies to build this for now - see https://github.com/doismellburning/samoyed/blob/main/dev-setup.sh for the package lists.

          This is an alpha release and likely contains bugs. Please file issues at https://github.com/doismellburning/samoyed/issues
        generate_release_notes: true
        files: |
          *.tgz
          *.deb
        fail_on_unmatched_files: true
        draft: true  # TODO Fix
        prerelease: true

  docs:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "docs"

    env:
      UV_LOCKED: 1  # Ensure lockfile is up to date at test time

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make bootstrap
      - run: make check
      - run: make dirhtml
        id: docs-build
      - run: make test
      - uses: actions/upload-pages-artifact@v5
        id: docs-upload-artifact
        with:
          path: docs/build/dirhtml/

  docs-deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: docs
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
